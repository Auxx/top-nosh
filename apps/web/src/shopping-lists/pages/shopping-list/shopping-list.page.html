@let columns = displayedColumns();

<!-- Page Header -->
<ui-page-header>
  <h1>Shopping Lists</h1>
  <div>
    Organize and manage your shopping lists.
  </div>

  <button matButton (click)="onCreateShoppingList()">
    <mat-icon>add</mat-icon>
    <span>Create Shopping List</span>
  </button>
</ui-page-header>

<!-- Table Card -->
@if (shoppingLists$ | async; as shoppingListsData) {
  <table mat-table [dataSource]="shoppingListsData.data" class="item-list-table">
    <!-- Name Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let item">
        <a [routerLink]="['/shopping-lists', item.id]" class="label">
          {{ item.name }}
        </a>
      </td>
    </ng-container>

    <!-- Description Column -->
    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef>Description</th>
      <td mat-cell *matCellDef="let item" class="item-description-medium">
        {{ item.description }}
      </td>
    </ng-container>

    <!-- Updated At Column -->
    <ng-container matColumnDef="updatedAt">
      <th mat-header-cell *matHeaderCellDef>Updated At</th>
      <td mat-cell *matCellDef="let item" class="nowrap-item">
        {{ item.updatedAt | date }}
      </td>
    </ng-container>

    <!-- Actions Column -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef class="actions">Actions</th>
      <td mat-cell *matCellDef="let item" class="actions">
        <button mat-icon-button
                aria-label="Delete shopping list"
                class="warn"
                (click)="onDeleteShoppingList(item)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns"></tr>

    <!-- No Data Row -->
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell empty-table-cell" [attr.colspan]="columns.length">
        <div class="empty-state">
          <mat-icon class="empty-icon">playlist_add_check</mat-icon>
          <p>No shopping lists found</p>
        </div>
      </td>
    </tr>
  </table>

  <!-- Paginator -->
  <mat-paginator [length]="shoppingListsData.total"
                 [pageSize]="50"
                 [pageIndex]="shoppingListsData.page - 1"
                 [pageSizeOptions]="[50]"
                 (page)="onPageChange($event)"
                 aria-label="Select shopping list page"/>
}
