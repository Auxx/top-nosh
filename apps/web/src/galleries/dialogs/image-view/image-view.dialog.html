<div class="image-view-container">
  <button type="button"
          matIconButton
          class="close-button"
          [mat-dialog-close]="true"
          aria-label="Close image view">
    <mat-icon>close</mat-icon>
  </button>

  @if (data.imageUrl) {
    <img [src]="data.imageUrl"
         alt="Full size view"
         class="full-image"/>
  }
</div>
