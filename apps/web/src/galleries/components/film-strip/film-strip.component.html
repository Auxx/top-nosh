@if (isLoading()) {
  <div class="film-strip-loading">
    <mat-spinner diameter="32"></mat-spinner>
  </div>
} @else if (images().length > 0) {
  <div class="film-strip-container" role="region" aria-label="Recipe image gallery">
    <div class="film-strip-scroll">
      @for (image of images(); track image.id; let i = $index) {
        <button type="button"
                (click)="onOpenImage(image)"
                [attr.aria-label]="'View photo ' + (i + 1)">
          <img [ngSrc]="image.thumbnail.externalUrl"
               [alt]="'Recipe photo ' + (i + 1)"
               width="300"
               height="200"
               loading="lazy"/>
        </button>
      }
    </div>
  </div>
}
