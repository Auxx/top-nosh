<ng-container *transloco="let t; prefix: 'web.CookingModeComponent'">
  @let currentRecipe = recipe();
  @let currentServings = servings();

  <app-ingredient-list [recipe]="currentRecipe"
                       [servings]="currentServings"
                       [groupByStage]="true"
                       [selectable]="true"/>

  <app-cooking-stages [recipe]="currentRecipe"/>
</ng-container>
