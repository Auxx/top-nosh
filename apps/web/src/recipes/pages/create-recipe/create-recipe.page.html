@let submitting = isSubmitting();

<div class="create-recipe-container">
  <header class="page-header">
    <div class="header-title">
      <h1>Create New Recipe</h1>
      <p class="subtitle">Define recipe metadata, cooking stages, steps, and ingredients</p>
    </div>

    <div class="header-actions">
      <button mat-stroked-button type="button" (click)="onCancel()">
        <mat-icon>arrow_back</mat-icon>
        Back to Recipes
      </button>
    </div>
  </header>

  <form [formGroup]="recipeForm" (ngSubmit)="onSubmit()" class="recipe-form">
    <app-recipe-form [form]="recipeForm" />

    <!-- Form Actions Card -->
    <mat-card class="section-card actions-card">
      <mat-card-content>
        <div class="form-actions">
          <button mat-stroked-button type="button" (click)="onCancel()" [disabled]="submitting">
            Cancel
          </button>
          <button mat-flat-button
                  color="primary"
                  type="submit"
                  [disabled]="recipeForm.invalid || submitting"
                  class="submit-btn">
            @if (!submitting) {
              <mat-icon>check</mat-icon>
            }
            <span>{{ submitting ? 'Creating Recipe...' : 'Create Recipe' }}</span>
          </button>
        </div>
      </mat-card-content>
    </mat-card>
  </form>
</div>
