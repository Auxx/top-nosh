<ng-container *transloco="let t; prefix: 'web.CreateRecipePage'">
  @let submitting = isSubmitting();

  <!-- Page Header -->
  <ui-page-header [showBackButton]="true" (navigatedBack)="onCancel()">
    <h1>{{ t('title') }}</h1>
    <div>
      {{ t('description') }}
    </div>

    <button matIconButton
            form="recipe-form"
            type="submit"
            [disabled]="recipeForm.invalid || submitting">
      <mat-icon>save</mat-icon>
    </button>
  </ui-page-header>

  <form [formGroup]="recipeForm"
        (ngSubmit)="onSubmit()"
        id="recipe-form"
        class="recipe-form">
    <!-- Recipe Form -->
    <app-recipe-form [form]="recipeForm"
                     [isSubmitting]="submitting"/>

    <!-- Form Actions Card -->
    <div class="form-section-actions">
      <button matButton="text"
              type="submit"
              [disabled]="recipeForm.invalid || submitting">
        @if (!submitting) {
          <mat-icon>save</mat-icon>
        }
        <span>{{ submitting ? t('creating') : t('submit') }}</span>
      </button>
    </div>
  </form>
</ng-container>
