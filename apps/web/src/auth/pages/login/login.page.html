<div class="login-container">
  <mat-card class="login-card">

    <mat-card-header>
      <mat-card-title>Login</mat-card-title>
    </mat-card-header>

    <mat-card-content>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="login-form">

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>

          <input matInput type="email" formControlName="email" placeholder="name@example.com"/>

          <mat-error *uiWhenError="form.controls.email; errorCode: 'required'">
            Email is required
          </mat-error>

          <mat-error *uiWhenError="form.controls.email; errorCode: 'email'">
            Please enter a valid email address
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>

          <input matInput type="password" formControlName="password" placeholder="Password"/>

          <mat-error *uiWhenError="form.controls.password; errorCode: 'required'">
            Password is required
          </mat-error>
        </mat-form-field>

        <div class="form-actions">
          <button mat-flat-button
                  color="primary"
                  type="submit"
                  [disabled]="form.invalid || isLoading()"
                  class="full-width">
            @if (isLoading()) {
              Logging in...
            } @else {
              Login
            }
          </button>
        </div>

      </form>

    </mat-card-content>

  </mat-card>
</div>
