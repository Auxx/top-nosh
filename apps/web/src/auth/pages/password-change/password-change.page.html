@let loading = isLoading();

<mat-card-header>
  <mat-card-title>Change Password</mat-card-title>
  <mat-card-subtitle>You have to change your password now, sorry.</mat-card-subtitle>
</mat-card-header>

<mat-card-content>

  <form class="single-column"
        id="change-password-form"
        [formGroup]="form"
        (ngSubmit)="onSubmit()">

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>New Password</mat-label>

      <input matInput type="password" formControlName="password" placeholder="New Password"/>

      <mat-error *uiWhenError="form.controls.password; errorCode: 'required'">
        Password is required
      </mat-error>

      <mat-error *uiWhenError="form.controls.password; errorCode: 'minlength'">
        Password must be at least 12 characters long
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Confirm Password</mat-label>

      <input matInput type="password" formControlName="confirmPassword" placeholder="Confirm Password"/>

      <mat-error *uiWhenError="form.controls.confirmPassword; errorCode: 'required'">
        Confirm password is required
      </mat-error>

      <mat-error *uiWhenError="form; errorCode: 'passwordMismatch'">
        Passwords do not match
      </mat-error>
    </mat-form-field>

  </form>

</mat-card-content>

<mat-card-actions>
  <button matButton
          type="submit"
          form="change-password-form"
          [disabled]="form.invalid || loading">
    @if (loading) {
      Saving...
    } @else {
      CHANGE PASSWORD
    }
  </button>
</mat-card-actions>
