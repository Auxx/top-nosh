<h2 mat-dialog-title>{{ title() }}</h2>
<mat-dialog-content>
  <p>{{ content() }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button [mat-dialog-close]="false">{{ data.cancelText || 'No' }}</button>
  <button mat-button [mat-dialog-close]="true">{{ data.confirmText || 'Yes' }}</button>
</mat-dialog-actions>
