<h2 mat-dialog-title>{{ title() }}</h2>
<mat-dialog-content>
  <p>{{ content() }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button matButton cdkFocusInitial [mat-dialog-close]="false">{{ data.cancelText || defaultCancel() }}</button>
  <button matButton="filled" [mat-dialog-close]="true">{{ data.confirmText || defaultConfirm() }}</button>
</mat-dialog-actions>
