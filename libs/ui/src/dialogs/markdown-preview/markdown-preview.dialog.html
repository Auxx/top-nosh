<h2 mat-dialog-title>{{ data.title || defaultTitle() }}</h2>
<mat-dialog-content>
  @if (data.markdown) {
    <remark [markdown]="data.markdown" />
  } @else {
    <p class="empty-state">{{ emptyText() }}</p>
  }
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button matButton [mat-dialog-close]="true">{{ closeText() }}</button>
</mat-dialog-actions>
