<ng-container *transloco="let t; prefix: 'ui.MenuBar'">
  <nav [attr.aria-label]="t('navigation')">
    <mat-toolbar>
      <span class="title">{{ title() }}</span>

      <span class="spacer"></span>

      @for (item of items(); track item.url) {
        @if (item.icon === undefined) {
          <a class="nav-link"
             [routerLink]="item.url"
             routerLinkActive="selected"
             ariaCurrentWhenActive="page">
            {{ item.label }}
          </a>
        } @else {
          <a matIconButton
             class="nav-icon"
             [routerLink]="item.url"
             routerLinkActive="selected"
             ariaCurrentWhenActive="page"
             [attr.aria-label]="item.label">
            <mat-icon>{{ item.icon }}</mat-icon>
          </a>
        }
      }

      <button matIconButton
              class="collapsed"
              [attr.aria-label]="t('more')"
              [matMenuTriggerFor]="menu">
        <mat-icon>more_vert</mat-icon>
      </button>
    </mat-toolbar>
  </nav>

  <mat-menu #menu="matMenu">
    @for (item of items(); track item.url) {
      <a mat-menu-item
         [routerLink]="item.url"
         routerLinkActive="selected"
         ariaCurrentWhenActive="page">
        @if (item.icon !== undefined) {
          <mat-icon>{{ item.icon }}</mat-icon>
        }
        {{ item.label }}
      </a>
    }
  </mat-menu>
</ng-container>
