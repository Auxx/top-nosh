<ng-container *transloco="let t; prefix: 'ui.menuBar'">
  <mat-toolbar>
    <span>Top Nosh</span>

    <span class="spacer"></span>

    @for (item of menuItems; track item.url) {
      <a matButton [routerLink]="item.url"
         routerLinkActive="selected"
         class="action">
        {{ t(item.label) }}
      </a>
    }

    <button matIconButton
            class="collapsed"
            [matMenuTriggerFor]="menu">
      <mat-icon>more_vert</mat-icon>
    </button>
  </mat-toolbar>

  <mat-menu #menu="matMenu">
    @for (item of menuItems; track item.url) {
      <button mat-menu-item [routerLink]="item.url">{{ t(item.label) }}</button>
    }
  </mat-menu>
</ng-container>
