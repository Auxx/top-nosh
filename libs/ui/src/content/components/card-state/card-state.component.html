@let loading = isLoading();
@let error = errorMessage();
@let notice = noticeMessage();

@if (loading) {
  <mat-spinner diameter="40"/>
} @else if (error !== undefined) {
  <p class="error-message">{{ error }}</p>
} @else if (notice !== undefined) {
  <p class="notice-message">{{ notice }}</p>
} @else {
  <ng-content/>
}
